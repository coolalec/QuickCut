name: update-ffmpeg

# Every push to main already runs this check (build.yml). This covers quiet stretches without pushes:
# weekly while GitHub keeps the schedule enabled, and by hand from Actions → update-ffmpeg → Run workflow.

on:
  schedule:
    - cron: '0 2 * * 1' # Mondays 10:00 Taiwan time
  workflow_dispatch:

permissions:
  contents: write
  # Passed on to build.yml, which attests the build
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Look for a newer FFmpeg release build
        id: bump
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./QuickCut/update-ffmpeg.ps1 -Commit

  # The artifact from this build is the one to try before tagging a release.
  build:
    needs: check
    if: needs.check.outputs.sha != ''
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.check.outputs.sha }}
